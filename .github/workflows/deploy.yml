name: Deploy

on:
  workflow_run:
    workflows: ["Docker Build & Scan"] # Đợi Docker build xong
    types:
      - completed
    branches:
      - develop # auto-deploy to staging
      - main # deploy to production (requires manual approval)

jobs:
  deploy-staging:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop'
    name: Deploy to Staging
    runs-on: self-hosted
    environment:
      name: staging
      url: http://localhost:8000 # Truy cập trên máy bạn qua localhost:8000

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy Staging Container
        run: |
          IMAGE_TAG="ghcr.io/${{ env.REPO_LC }}:${{ github.event.workflow_run.head_sha }}"

          echo ">>> [Staging] Tải image mới: $IMAGE_TAG"
          docker pull $IMAGE_TAG

          echo ">>> [Staging] Dừng và xóa container cũ"
          docker stop my-app-staging || true
          docker rm my-app-staging || true

          echo ">>> [Staging] Khởi chạy container mới tại Port 8000"
          docker run -d \
            --name my-app-staging \
            --restart unless-stopped \
            -p 8000:8000 \
            $IMAGE_TAG

  deploy-production:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    name: Deploy to Production
    runs-on: self-hosted
    environment:
      name: production
      url: http://localhost:8080 # Truy cập production trên máy bạn qua localhost:8080

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy Production Container
        run: |
          IMAGE_TAG="ghcr.io/${{ env.REPO_LC }}:${{ github.event.workflow_run.head_sha }}"

          echo ">>> [Production] Tải image mới: $IMAGE_TAG"
          docker pull $IMAGE_TAG

          echo ">>> [Production] Dừng và xóa container cũ"
          docker stop my-app-production || true
          docker rm my-app-production || true

          echo ">>> [Production] Khởi chạy container mới tại Port 8080"
          # Ánh xạ port 8080 trên máy thật vào port 8000 của container
          docker run -d \
            --name my-app-production \
            --restart unless-stopped \
            -p 8080:8000 \
            $IMAGE_TAG

