name: Deploy

on:
  workflow_run:
    workflows: ["Docker Build & Scan"]
    types:
      - completed
    branches:
      - develop # auto-deploy to staging
      - main # deploy to production (requires manual approval)

jobs:
  deploy-staging:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop'
    name: Deploy to Staging
    runs-on: self-hosted
    environment:
      name: staging
      url: http://localhost:8000

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Detect active slot
        id: detect-slot
        run: |
          # Blue is active if myapp_blue is running; otherwise assume green is active
          # (first deploy ever: default to green so the script deploys to blue)
          if docker ps --filter "name=myapp_blue" --filter "status=running" --format "{{.Names}}" | grep -q "myapp_blue"; then
            echo "active_slot=blue" >> $GITHUB_OUTPUT
          else
            echo "active_slot=green" >> $GITHUB_OUTPUT
          fi

      - name: Run Blue-Green deployment
        run: |
          IMAGE_TAG="ghcr.io/${{ env.REPO_LC }}:${{ github.event.workflow_run.head_sha }}"
          chmod +x scripts/deploy_bluegreen.sh
          scripts/deploy_bluegreen.sh "$IMAGE_TAG" "${{ steps.detect-slot.outputs.active_slot }}"

      - name: Rollback notice
        if: failure()
        run: |
          echo "🔄 Deployment failed — the previously active slot is still serving traffic."
          echo "   Active slot was: ${{ steps.detect-slot.outputs.active_slot }}"
          docker ps --filter "name=myapp_" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

  deploy-production:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    name: Deploy to Production (Blue-Green)
    runs-on: self-hosted
    environment:
      name: production
      url: http://localhost:8000

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Detect active slot
        id: detect-slot
        run: |
          if docker ps --filter "name=myapp_blue" --filter "status=running" --format "{{.Names}}" | grep -q "myapp_blue"; then
            echo "active_slot=blue" >> $GITHUB_OUTPUT
          else
            echo "active_slot=green" >> $GITHUB_OUTPUT
          fi

      - name: Run Blue-Green deployment
        run: |
          IMAGE_TAG="ghcr.io/${{ env.REPO_LC }}:${{ github.event.workflow_run.head_sha }}"
          chmod +x scripts/deploy_bluegreen.sh
          scripts/deploy_bluegreen.sh "$IMAGE_TAG" "${{ steps.detect-slot.outputs.active_slot }}"

      # ── Rollback info on failure ───────────────────────────────────────────
      - name: Rollback notice
        if: failure()
        run: |
          echo "🔄 Deployment failed — the previously active slot is still serving traffic."
          echo "   Active slot was: ${{ steps.detect-slot.outputs.active_slot }}"
          docker ps --filter "name=myapp_" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
