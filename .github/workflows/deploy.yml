name: Deploy

on:
  workflow_run:
    workflows: ["Docker Build & Scan"] # Đợi Docker build xong
    types:
      - completed
    branches:
      - develop
      - main

jobs:
  deploy-local:
    # Chỉ chạy khi build thành công
    if: github.event.workflow_run.conclusion == 'success'
    name: Deploy to Local Machine
    runs-on: self-hosted # Chạy trực tiếp qua Runner trên máy bạn

    # Cấp quyền cho GITHUB_TOKEN để nó có thể tải Docker Image từ GHCR
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry (GHCR)
        # Sử dụng GITHUB_TOKEN mặc định của GitHub Action, không cần tạo Secret
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy Docker Container Local
        run: |
          # 1. Định nghĩa tên image
          IMAGE_TAG="ghcr.io/${{ env.REPO_LC }}:${{ github.event.workflow_run.head_sha }}"

          echo ">>> Bắt đầu tải image mới về máy tính: $IMAGE_TAG"
          docker pull $IMAGE_TAG

          echo ">>> Dừng và xóa container cũ (nếu có)"
          # Lưu ý: 'my-app-container' là tên định danh trên máy bạn, bạn có thể đổi tên khác
          docker stop my-app-container || true
          docker rm my-app-container || true

          echo ">>> Khởi chạy container mới"
          # LƯU Ý: Thay đổi cổng 8000:8000 cho khớp với ứng dụng của bạn
          docker run -d \
            --name my-app-container \
            --restart unless-stopped \
            -p 8000:8000 \
            $IMAGE_TAG
            
          echo ">>> Cập nhật thành công!"

