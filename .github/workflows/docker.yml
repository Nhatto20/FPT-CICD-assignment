name: Docker Build & Scan

on:
  workflow_run:
    workflows: ["CI Pipeline"]   # must match the name: field in ci.yml exactly
    types:
      - completed
    branches:
      - main
      - develop

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to ghcr.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Add this step to convert the repository name to lowercase
      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # auto-provided by GitHub, no setup needed

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Use the new lowercase environment variable here
          tags: |
            ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}
            ghcr.io/${{ env.REPO_LC }}:latest

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          # Use the new lowercase environment variable here as well
          image-ref: ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}
          format: table
          exit-code: 1 # fail the job if HIGH/CRITICAL CVEs found
          severity: HIGH,CRITICAL
          ignore-unfixed: true
