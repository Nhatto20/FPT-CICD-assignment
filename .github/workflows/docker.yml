name: Docker Build & Scan

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "Dockerfile*"
      - "requirements*.txt"
      - "pyproject.toml"
      - "!docs/**"
      - "!**/*.md"
      - "!LICENSE"
      - "**.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to ghcr.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Add this step to convert the repository name to lowercase
      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # auto-provided by GitHub, no setup needed

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Use the new lowercase environment variable here
          tags: |
            ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}
            ghcr.io/${{ env.REPO_LC }}:latest

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          # Use the new lowercase environment variable here as well
          image-ref: ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}
          format: table
          exit-code: 1 # fail the job if HIGH/CRITICAL CVEs found
          severity: CRITICAL
