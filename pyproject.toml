[build-system]
requires = ["setuptools>=61.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "myapp"
version = "0.1.0"
description = "Simple FastAPI app"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.116.0", 
    "uvicorn==0.34.2",
    "starlette>=0.49.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "anyio[trio]",
    "ruff",
    "black",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88
target-version = ["py311"]